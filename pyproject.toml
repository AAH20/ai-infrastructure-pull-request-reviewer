[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infrastructure-pull-request-reviewer"
version = "0.1.0"
description = "Evidence-driven pull request decisions for cloud, Kubernetes, networking and IaC"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ahmed Hassan"}]
keywords = ["infrastructure-as-code", "terraform", "opentofu", "azure", "kubernetes", "finops", "devops", "sre", "ai-code-review"]

[project.scripts]
infra-pr-review = "infra_pr_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

